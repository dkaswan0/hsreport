services:
  - type: web
    name: high-safety-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run db:push && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: high-safety-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: hs
      - key: ADMIN_PASSWORD
        value: ahmed

databases:
  - name: high-safety-db
    plan: free
